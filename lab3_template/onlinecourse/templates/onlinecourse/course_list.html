
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Popular Courses</title>

    {% load static %}
    <link rel="stylesheet"
          href="{% static 'onlinecourse/course.css' %}">
</head>

<body>

{% if course_list %}

    {% for course in course_list %}

        <div class="container">
            <div class="row">

                <div class="column-33">
                    <img
                        src="{{ MEDIA_URL }}/{{ course.image }}"
                        width="360"
                        height="360"
                        alt="{{ course.name }}"
                    >
                </div>

                <div class="column-66">

                    <h1 class="xlarge-font">
                        <b>{{ course.name }}</b>
                    </h1>

                    <p style="color:MediumSeaGreen;">
                        <b>
                            {{ course.total_enrollment }} enrolled
                        </b>
                    </p>

                    <p>{{ course.description }}</p>

                    <form
                        action="{% url 'onlinecourse:enroll' course.id %}"
                        method="post">

                        {% csrf_token %}

                        <input
                            class="button"
                            type="submit"
                            value="Enroll"
                        >

                    </form>

                </div>
            </div>
        </div>

        <hr>

    {% endfor %}

{% else %}

    <p>No courses are available.</p>

{% endif %}

</body>
</html>
